name: Build Frida Android Gadget

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FRIDA_COMPILER_MOD: subprojects/frida-core/src/compiler/go.mod
  ANDROID_NDK_VERSION: r29

jobs:
  build-android-gadget:
    name: Build Android Gadget (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64, x86, x86_64]
      fail-fast: false

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Grab frida-core
        run: python tools/ensure-submodules.py frida-core

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.FRIDA_COMPILER_MOD }}
          cache-dependency-path: ${{ env.FRIDA_COMPILER_MOD }}

      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false

      - name: Add ANDROID_NDK_ROOT to environment
        run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Configure & Compile & Install
        run: |
          export FRIDA_PREFIX=$(pwd)/build/frida-android-${{ matrix.arch }}
          ./configure \
            "--prefix=$FRIDA_PREFIX" \
            --host=android-${{ matrix.arch }} \
            --enable-gadget \
            --disable-server \
            --disable-inject
          make frida-gadget
          make install

      - name: Strip Debug Symbols for Size Optimization
        run: |
          STRIP="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          SO_PATH="build/frida-android-${{ matrix.arch }}/lib/frida-1.0/"
          if [ "${{ matrix.arch }}" = "arm" ] || [ "${{ matrix.arch }}" = "x86" ]; then
            "$STRIP" --strip-all ${SO_PATH}32/frida-gadget.so
          else
            "$STRIP" --strip-all ${SO_PATH}64/frida-gadget.so
          fi

      - name: Upload 32-bit frida-gadget
        if: ${{ !contains(matrix.arch, '64') }}
        uses: actions/upload-artifact@v7
        with:
          name: frida-gadget-android-${{ matrix.arch }}
          path: build/frida-android-${{ matrix.arch }}/lib/frida-1.0/32/frida-gadget.so

      - name: Upload 64-bit frida-gadget
        if: ${{ contains(matrix.arch, '64') }}
        uses: actions/upload-artifact@v7
        with:
          name: frida-gadget-android-${{ matrix.arch }}
          path: build/frida-android-${{ matrix.arch }}/lib/frida-1.0/64/frida-gadget.so
