name: Build Frida Android Gadget

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  FRIDA_COMPILER_MOD: subprojects/frida-core/src/compiler/go.mod
  ANDROID_NDK_VERSION: r29

jobs:
  build-android-gadget:
    name: Build Android Gadget (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [arm, arm64]
      fail-fast: false

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grab frida-core and frida-gum
        run: |
          python tools/ensure-submodules.py frida-core
          python tools/ensure-submodules.py frida-gum

      - name: Switch frida‑core branch
        run: |
          cd subprojects/frida-core
          git remote set-url origin https://github.com/luyeguigen/frida-core.git
          git fetch origin custom-frida-core
          git reset --hard FETCH_HEAD

      - name: Switch frida‑gum branch
        run: |
          cd subprojects/frida-gum
          git remote set-url origin https://github.com/luyeguigen/frida-gum.git
          git fetch origin custom-gum
          git reset --hard FETCH_HEAD

      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false

      - name: Configure & Compile
        run: |
          FRIDA_PREFIX=$(pwd)/build/frida-android-${{ matrix.arch }}
          ./configure --prefix=${FRIDA_PREFIX} --host=android-${{ matrix.arch }}
          make -j$(nproc)
          make install

      - name: Patch binary strings
        run: |
          python3 -c "
          import os, glob
          replacements = {
              b'gmain': b'mmain',
              b'gdbus': b'mdbus'
          }
          for old,new in replacements.items():
              assert len(old)==len(new)
          prefix_dir = 'build/frida-android-${{ matrix.arch }}'
          for so in glob.glob(f'{prefix_dir}/**/*.so', recursive=True):
              print(f'patch {so}')
              with open(so,'rb') as f: d = f.read()
              for o,n in replacements.items():
                  d = d.replace(o,n)
              with open(so,'wb') as f: f.write(d)
          "

      # 重命名，直接放到当前工作目录根，不要嵌套output文件夹
      - name: Rename gadget so
        run: |
          if ${{ contains(matrix.arch, '64') }}; then
              cp build/frida-android-${{ matrix.arch }}/lib/frida-1.0/64/frida-gadget.so ./gd.so
              echo "Renamed arm64 -> gd.so"
          else
              cp build/frida-android-${{ matrix.arch }}/lib/frida-1.0/32/frida-gadget.so ./gd32.so
              echo "Renamed arm -> gd32.so"
          fi

      # 上传单个so文件作为artifact，名字不带子目录
      - name: Upload single so artifact
        uses: actions/upload-artifact@v4
        with:
          name: so‑${{ matrix.arch }}
          path: |
            ./gd.so
            ./gd32.so

  gather_artifacts:
    name: Package all so into one zip archive
    runs-on: ubuntu-latest
    needs: build-android-gadget
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "so‑*"
          merge-multiple: true
          # 关键！merge‑multiple=true 会把所有so直接解压到当前目录根，不再嵌套子文件夹

      - name: Show downloaded files
        run: ls -la

      - name: Zip both so
        run: |
          mkdir -p final
          cp gd.so final/
          cp gd32.so final/
          cd final
          zip frida_gadget_all.zip gd.so gd32.so

      - name: Upload zip package
        uses: actions/upload-artifact@v4
        with:
          name: frida_gadget_all_in_one
          path: final/frida_gadget_all.zip
