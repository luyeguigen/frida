name: Build Frida Android Gadget

on:
  workflow_dispatch: # 支持在 GitHub 界面手动触发构建
  push:
    tags:
      - 'v*' # 打 Tag 时自动触发，例如 git tag v16.1.4 && git push origin v16.1.4

env:
  FRIDA_COMPILER_MOD: subprojects/frida-core/src/compiler/go.mod
  ANDROID_NDK_VERSION: r29

jobs:
  build-android-gadget:
    name: Build Android Gadget (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 包含 32 位 (arm, x86) 和 64 位 (arm64, x86_64)
        arch: [arm, arm64, x86, x86_64]
      fail-fast: false

    steps:
      - name: Check out repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Grab frida-core
        run: python tools/ensure-submodules.py frida-core

      - name: Install Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ env.FRIDA_COMPILER_MOD }}
          cache-dependency-path: ${{ env.FRIDA_COMPILER_MOD }}

      - name: Set up NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ env.ANDROID_NDK_VERSION }}
          add-to-path: false

      - name: Add ANDROID_NDK_ROOT to environment
        run: echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV

      - name: Configure
        run: >-
          ./configure
          "--prefix=$FRIDA_PREFIX"
          --host=android-${{ matrix.arch }}
          --enable-gadget
          --disable-server
          --disable-portal
          --disable-inject

      - name: Compile
        run: make gadget

      - name: Install
        run: make install

      # 32 位架构路径在 $FRIDA_PREFIX/lib/frida-1.0/32/frida-gadget.so
      - name: Upload 32-bit frida-gadget
        if: ${{ !contains(matrix.arch, '64') }}
        uses: actions/upload-artifact@v7
        with:
          name: frida-gadget-android-${{ matrix.arch }}
          path: ${{ env.FRIDA_PREFIX }}/lib/frida-1.0/32/frida-gadget.so

      # 64 位架构路径在 $FRIDA_PREFIX/lib/frida-1.0/64/frida-gadget.so
      - name: Upload 64-bit frida-gadget
        if: ${{ contains(matrix.arch, '64') }}
        uses: actions/upload-artifact@v7
        with:
          name: frida-gadget-android-${{ matrix.arch }}
          path: ${{ env.FRIDA_PREFIX }}/lib/frida-1.0/64/frida-gadget.so
